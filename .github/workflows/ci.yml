name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit, architecture (ArchUnit) and integration tests (Testcontainers SQL Server and Service Bus emulator).
      - run: ./mvnw -B -ntp verify

  # Publishes docker.io/<DOCKERHUB_USERNAME>/payflow-payment-service:<tag> when a v* tag is pushed.
  # Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/payflow-payment-service:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/payflow-payment-service:latest
