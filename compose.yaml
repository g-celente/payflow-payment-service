name: payflow-payment

# Local run: SQL Server 2022 (the Azure SQL engine), the official Service Bus emulator and the service.
# To use Azure instead, set AZURE_SQL_* and SERVICEBUS_CONNECTION_STRING in .env.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # No arm64 image: on Apple Silicon, Docker Desktop runs it with Rosetta emulation.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Creates the payments database once; Flyway creates the tables when the service starts.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q \"IF DB_ID('payments') IS NULL CREATE DATABASE payments\""]
    restart: "no"

  # Queue payment-events with MaxDeliveryCount 5 (docker/servicebus/Config.json). Stores its data in sqlserver.
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:5300:5300"

  payment-service:
    image: ${PAYMENT_SERVICE_IMAGE:-payflow/payment-service:dev}
    build:
      context: .
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      servicebus:
        condition: service_started
    environment:
      AZURE_SQL_URL: ${AZURE_SQL_URL:-jdbc:sqlserver://sqlserver:1433;databaseName=payments;encrypt=true;trustServerCertificate=true}
      AZURE_SQL_USERNAME: ${AZURE_SQL_USERNAME:-sa}
      AZURE_SQL_PASSWORD: ${AZURE_SQL_PASSWORD:-${MSSQL_SA_PASSWORD}}
      SERVICEBUS_CONNECTION_STRING: ${SERVICEBUS_CONNECTION_STRING:-Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
      SERVICEBUS_QUEUE: ${SERVICEBUS_QUEUE:-payment-events}
      PAYFLOW_INTERNAL_KEY: ${PAYFLOW_INTERNAL_KEY:?Set PAYFLOW_INTERNAL_KEY in .env}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  sql-data:
