spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    # Without AZURE_SQL_*, the SQL Server started by `docker compose up -d sqlserver sqlserver-init`.
    url: ${AZURE_SQL_URL:jdbc:sqlserver://localhost:1433;databaseName=payments;encrypt=true;trustServerCertificate=true}
    username: ${AZURE_SQL_USERNAME:sa}
    password: ${AZURE_SQL_PASSWORD:${MSSQL_SA_PASSWORD}}

payflow:
  internal-key: ${PAYFLOW_INTERNAL_KEY}
  messaging:
    # Without SERVICEBUS_CONNECTION_STRING, the emulator started by `docker compose up -d servicebus`.
    connection-string: ${SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
